name: DepthWire
options:
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: ../Config/Signing.xcconfig
  Release: ../Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  DepthWire:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - ../Shared
    dependencies:
      - target: DepthWireExtension
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).depthwire.mac
        PRODUCT_NAME: DepthWire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: DepthWire needs camera access to find its virtual camera.
        NSLocalNetworkUsageDescription: DepthWire receives depth from your iPhone over the local network.
        NSBonjourServices: [_depthwire._tcp]
        NSSystemExtensionUsageDescription: Adds the “DepthWire” camera to your Mac.
    entitlements:
      path: App/DepthWire.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).depthwire.mac]

  DepthWireExtension:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared/CameraConstants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).depthwire.mac.Extension
        PRODUCT_NAME: $(BUNDLE_ID_PREFIX).depthwire.mac.Extension
        SKIP_INSTALL: YES
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: DepthWire Extension
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: Adds the “DepthWire” camera to your Mac.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: Extension/DepthWireExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).depthwire.mac]
