name: DepthWire
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: ../Config/Signing.xcconfig
  Release: ../Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DepthWire:
    type: application
    platform: iOS
    sources:
      - DepthWire
      - ../Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).depthwire.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: DepthWire/Info.plist
      properties:
        CFBundleDisplayName: DepthWire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: DepthWire reads depth from the LiDAR scanner to stream it to your Mac.
        NSLocalNetworkUsageDescription: DepthWire streams depth to your Mac over the local network.
        NSBonjourServices: [_depthwire._tcp]
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
